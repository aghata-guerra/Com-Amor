<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Mantém o fundo preto
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        resize();

        // Configurações do texto
        ctx.fillStyle = "red";
        ctx.font = "bold 8px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Começa na escala 11 (igual ao seu original)
        let scale = 11;
        let i = 0;

        function draw() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Se completou a volta de 120 pontos da camada atual, vai para a próxima escala maior
            if (i >= 120) {
                i = 0;
                scale += 0.5; // Aumenta de 0.5 em 0.5 para as camadas ficarem bem juntinhas e preenchidas
            }

            // O código NÃO para mais na escala 16. Ele calcula a diagonal da tela para saber quando cobriu tudo
            const maxScaleNeeded = Math.max(canvas.width, canvas.height) / 10;
            if (scale > maxScaleNeeded) {
                return; // Só para quando realmente preencher a tela inteira de ponta a ponta
            }

            // Equação matemática original do seu coração
            const angle = i * (Math.PI * 2) / 120;
            const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
            const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale;

            // Desenha a frase na posição calculada (sempre baseada no centro da tela)
            ctx.fillText("Eu te amo", centerX + x, centerY + y);

            i++;

            // Mantém o efeito do tempo passando ao desenhar letra por letra
            requestAnimationFrame(draw);
        }

        // Inicia a animação do coração que cresce
        draw();

        window.addEventListener('resize', () => {
            resize();
            ctx.fillStyle = "red";
            ctx.font = "bold 8px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
        });
    </script>
</body>
</html>
